<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" type="text/css" href="index.css">

		<title>os3d</title>

			<div class="panel is-hidden">
				<div class="ui-box">
					<div class="title">Presets</div>
					<div class="button-group button-group--presets cols4">
						<button data-action="reset">1</button>
						<button data-action="reset">2</button>
						<button data-action="reset">3</button>
						<button data-action="reset">4</button>
					</div>
				</div>

				<div class="ui-box">
					<div class="title">Dimensions</div>
					<div class="button-group button-group--dimensions cols3">
						<button data-action="toggle1D">
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><title>vector-line</title><path d="M15,3V7.59L7.59,15H3V21H9V16.42L16.42,9H21V3M17,5H19V7H17M5,17H7V19H5" /></svg>

							<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16.008v-8.018a1.98 1.98 0 0 0 -1 -1.717l-7 -4.008a2.016 2.016 0 0 0 -2 0l-7 4.008c-.619 .355 -1 1.01 -1 1.718v8.018c0 .709 .381 1.363 1 1.717l7 4.008a2.016 2.016 0 0 0 2 0l7 -4.008c.619 -.355 1 -1.01 1 -1.718z" /><path d="M12 22v-10" /><path d="M12 12l8.73 -5.04" /><path d="M3.27 6.96l8.73 5.04" /></svg>
						</button>
					</div>
				</div>

				<div class="ui-box">
					<div class="title">Perspective</div>
					<div class="button-group button-group--perspective cols2">
						<button data-action="set0Deg">0 deg</button>
						<button data-action="set45Deg">45 deg</button>
					</div>
				</div>

				<div class="ui-box">
					<ul>
						<li>
							<div class="icon icon-list">

							</div>
							
							<span>Vertexes</span>

							<div id="cb-vertex" class="checkbox" data-action="toggleVertex"></div>
						</li>
						
						<li>

							<div id="cb-mesh" class="checkbox" data-action="toggleMesh"></div>
						</li>
			
						<li>
							<div class="icon icon-list">
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><title>rotation</title><path d="M12,5C16.97,5 21,7.69 21,11C21,12.68 19.96,14.2 18.29,15.29C19.36,14.42 20,13.32 20,12.13C20,9.29 16.42,7 12,7V10L8,6L12,2V5M12,19C7.03,19 3,16.31 3,13C3,11.32 4.04,9.8 5.71,8.71C4.64,9.58 4,10.68 4,11.88C4,14.71 7.58,17 12,17V14L16,18L12,22V19Z" /></svg>

							<div class="icon icon-list">
